name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: DevilConnection-Korean-Patcher.AppImage
          - os: windows-latest
            asset: DevilConnection-Korean-Patcher.exe
          - os: macos-latest
            asset: DevilConnection-Korean-Patcher.zip
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build with embedded translation data
        run: cargo build --release --locked --features embed-data

      - name: Package portable executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/dc-patcher-gui.exe "dist/${{ matrix.asset }}"
          ls -lh dist

      - name: Package application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_name="DevilConnection-Korean-Patcher"
          version="${GITHUB_REF_NAME#v}"

          staging="$(mktemp -d)"
          app="$staging/$app_name.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/dc-patcher-gui "$app/Contents/MacOS/dc-patcher-gui"

          iconset="$(mktemp -d)/icon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icon.png \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size * 2))" "$((size * 2))" assets/icon.png \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/icon.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>ko</string>
            <key>CFBundleExecutable</key><string>dc-patcher-gui</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundleIdentifier</key><string>dev.nyabi.devil-connection-patcher</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$app_name</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          codesign --force --sign - "$app"
          codesign --verify --strict "$app"

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${{ matrix.asset }}"
          ls -lh dist

      - name: Package AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appdir=AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/512x512/apps"
          cp target/release/dc-patcher-gui "$appdir/usr/bin/dc-patcher-gui"
          cp assets/icon.png "$appdir/usr/share/icons/hicolor/512x512/apps/dc-patcher-gui.png"
          cp assets/icon.png "$appdir/dc-patcher-gui.png"

          cat > "$appdir/dc-patcher-gui.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=DevilConnection-Korean-Patcher
          Comment=Unofficial Korean translation patcher for Devil Connection
          Exec=dc-patcher-gui
          Icon=dc-patcher-gui
          Categories=Utility;
          Terminal=false
          DESKTOP
          cp "$appdir/dc-patcher-gui.desktop" "$appdir/usr/share/applications/"

          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")"
          exec "$here/usr/bin/dc-patcher-gui" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$appdir" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
